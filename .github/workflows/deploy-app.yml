name: Deploy

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - ".github/workflows/**"
            - ".dockerignore"
            - "Dockerfile"
            - "package.json"

permissions:
    contents: read

jobs:
    build-push:
        name: Build and push
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Login to GHCR
              uses: docker/login-action@v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ghcr.io/alialjaffer/my-app:${{ github.sha }}
