services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - tier=backend
    depends_on:
      postgresql:
        condition: service_healthy
        required: true
    env_file:
      - .env
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
    ports:
      - "8080:${PORT:-8080}"
    networks:
      - api-demo
  postgresql:
    image: postgres@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    labels:
      - tier=db
    environment:
      POSTGRES_DB: ${DB_NAME:-notifications}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-notifications}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - api-demo
networks:
  api-demo:
    driver: bridge
volumes:
  postgres-data:
